name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cropscan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cropscan/package-lock.json

      - name: Install dependencies
        # Using `npm install` (not `npm ci`) to work around an npm peer/optional
        # dep mismatch in @tailwindcss/oxide-wasm32-wasi that trips `npm ci`
        # when the lockfile is generated on Windows and consumed on Linux.
        # Top-level versions are still pinned via package-lock.json.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

  backend:
    name: Backend tests + compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.docker.txt

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.docker.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
          pip install timm==1.0.11

      - name: Compile check
        run: python -m compileall app

      - name: Pytest
        env:
          SKIP_DB_INIT: "true"
          MONGODB_URL: "mongodb://localhost:27017"
          JWT_SECRET_KEY: "ci-secret-key-with-enough-length-1234567890"
          EMAIL_DEBUG_OTP: "true"
          RATE_LIMIT_ENABLED: "false"
          RESEND_API_KEY: ""
          RESEND_FROM_EMAIL: ""
        run: python -m pytest tests -v
